<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

cfg.sz.text=cfg.sz.text||6;cfg.tp=!!cfg.tp;const saveCfg=()=>J.set('h.cfg',cfg);
function applyCfg(){const r=document.documentElement;cfg.theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=cfg.theme;r.style.setProperty('--pr',cfg.accent)}applyCfg();

const IC={pen:'<path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7.4 18.6l-4 1 1-4z"/>',hi:'<path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>',eraser:'<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/>',line:'<path d="M5 19 19 5"/>',arrow:'<path d="M5 19 19 5"/><path d="M9 5h10v10"/>',rect:'<rect x="3" y="5" width="18" height="14" rx="2"/>',oval:'<ellipse cx="12" cy="12" rx="10" ry="7"/>',type:'<path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/>',hand:'<path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/>',back:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',minus:'<path d="M5 12h14"/>',plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',fit:'<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',undo:'<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>',redo:'<path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/>',dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',set:'<path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/>',star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2L5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',bm:'<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/>',board:'<rect x="3" y="3" width="18" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>',folder:'<path d="m6 14 1.5-2.9A2 2 0 0 1 9.2 10H20a2 2 0 0 1 1.9 2.6l-1.6 5.5a2 2 0 0 1-1.9 1.4H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.7.9l.8 1.2a2 2 0 0 0 1.7.9H18a2 2 0 0 1 2 2v2"/>',full:'<path d="M15 3h6v6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/><path d="M9 21H3v-6"/>'};
function ic(n,s=20,f){return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`}
function paint(){const m={bb:'back',zo:'minus',zf:'fit',zi:'plus',un:'undo',re:'redo',ex:'dl',bset:'set',sq:'search',bm:'bm',fs:'full'};for(const k in m)$('#'+k).innerHTML=ic(m[k]);document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic,20))}
async function backup(){const fs=await all('files'),o={v:1,files:[]};for(const f of fs)o.files.push({f,ink:await get('ink',f.id)});await saveFile('hima-backup.json',new Blob([JSON.stringify(o)],{type:'application/json'}))}
async function restore(file){const o=JSON.parse(await file.text());let n=0;for(const x of o.files||[]){if(!await get('files',x.f.id))await put('files',x.f);if(x.ink)await put('ink',x.ink,x.f.id);n++}toast('تمت استعادة '+n+' عنصر');closeM();home()}
/* ---- storage ---- */
const idb=new Promise((res,rej)=>{try{const r=indexedDB.open('hima',1);r.onupgradeneeded=()=>['files','ink','blobs'].forEach(n=>r.result.createObjectStore(n,n==='files'?{keyPath:'id'}:undefined));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const tx=(s,m,f)=>idb.then(d=>new Promise((res,rej)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=t.onabort=()=>rej(t.error)}));
const put=(s,v,k)=>tx(s,'readwrite',o=>o.put(v,k)),get=(s,k)=>tx(s,'readonly',o=>o.get(k)),all=s=>tx(s,'readonly',o=>o.getAll()),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
/* ---- onboarding / profile ---- */
function swatches(el,cur,fn){el.innerHTML='';['#1f5fd6','#0e8a7d','#7c3aed','#d9480f','#c2255c'].forEach(c=>{const b=document.createElement('button');b.style.background=c;b.className=c===cur?'on':'';b.onclick=()=>{fn(c);swatches(el,c,fn)};el.append(b)})}
function avatar(el,p){el.style.backgroundImage=p.photo?`url(${p.photo})`:'';el.textContent=p.photo?'':(p.name||'+ صورة').trim().slice(0,p.photo||!p.name?9:1)}
function readPhoto(file,cb){const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const s=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,256,256);cb(c.toDataURL('image/jpeg',.85))};i.onerror=()=>toast('تعذر قراءة الصورة');i.src=URL.createObjectURL(file)}
let draft={name:'',field:'',photo:'',accent:cfg.accent};
swatches($('#osw'),cfg.accent,c=>{draft.accent=cfg.accent=c;applyCfg()});
$('#oph').onchange=e=>e.target.files[0]&&readPhoto(e.target.files[0],u=>{draft.photo=u;avatar($('#oav'),draft)});
$('#ogo').onclick=()=>{const n=$('#oname').value.trim();if(!n)return toast('اكتب اسمك أولًا');prof={name:n,field:$('#ofield').value.trim(),photo:draft.photo};J.set('h.prof',prof);saveCfg();home()};
/* ---- home ---- */
async function home(){go('home');avatar($('#av'),prof);$('#nm').textContent=prof.name+(prof.field?' · '+prof.field:'');let fs=[];try{fs=await all('files')}catch(e){toast('تعذر الوصول إلى التخزين')}
const q=$('#q').value.trim().toLowerCase();fs=fs.filter(f=>f.name.toLowerCase().includes(q)).sort((a,b)=>b.last-a.last);const L=$('#lists');L.innerHTML='';
if(!fs.length){L.innerHTML=`<div class="emp">${q?'لا نتائج مطابقة.':'لا توجد ملفات بعد.<br>افتح ملف PDF أو صورة لتبدأ التدوين، أو ابدأ سبورة جديدة.'}</div>`;return}
const sec=(t,a)=>{if(!a.length)return;L.insertAdjacentHTML('beforeend',`<h3>${t}</h3>`);a.forEach(f=>{const d=document.createElement('div');d.className='cd';d.innerHTML=`<div class="ic">${ic({pdf:'file',image:'img',html:'globe',board:'board'}[f.kind],22)}</div><div class="in"><b>${esc(f.name)}</b><small>${f.kind==='pdf'?'آخر صفحة: '+((f.page||0)+1):{image:'صورة',html:'HTML',board:'سبورة'}[f.kind]}</small></div><button class="ib" data-a="fav">${ic('star',18,f.fav)}</button><button class="ib" data-a="ren">${ic('pen',18)}</button><button class="ib" data-a="rm">${ic('x',18)}</button>`;d.onclick=async e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return openRec(f);if(a==='fav'){f.fav=!f.fav;await put('files',f);home()}if(a==='ren'){const n=await ask('اسم جديد للملف',f.name);if(n){f.name=n;await put('files',f);home()}}if(a==='rm'&&await ask('إزالة «'+f.name+'» من البرنامج؟ لن يُحذف الملف الأصلي من جهازك.')){await del('files',f.id);await del('blobs',f.id);await del('ink',f.id);home()}};L.append(d)})};
sec('المثبّتة',fs.filter(f=>f.fav));sec('الأخيرة',fs.filter(f=>!f.fav))}
$('#q').oninput=home;
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];f&&ingest(f).catch(x=>toast('تعذر فتح الملف: '+x.message))});
$('#fin').onchange=e=>{const file=e.target.files[0];setTimeout(()=>{e.target.value=''},500);file&&ingest(file).catch(x=>toast('تعذر فتح الملف: '+x.message))};
async function ingest(file){toast('جارٍ فتح الملف…');const n=file.name.toLowerCase(),kind=/\.pdf$/.test(n)||file.type==='application/pdf'?'pdf':file.type.startsWith('image/')?'image':/\.html?$/.test(n)?'html':null;if(!kind)return toast('صيغة غير مدعومة. المدعوم: PDF والصور وHTML');
const id=[file.name,file.size,file.lastModified].join('|');let f;try{f=await get('files',id)}catch(e){}f=f||{id,name:file.name.replace(/\.[^.]+$/,''),kind,page:0,z:1,added:Date.now()};f.last=Date.now();try{await put('blobs',file,id);await put('files',f)}catch(e){toast('تعذر حفظ الملف في التخزين، سيُفتح لهذه الجلسة فقط');f.tmp=file}openRec(f)}
$('#bboard').onclick=async()=>{const f={id:'b'+Date.now(),name:'سبورة '+new Date().toLocaleDateString('ar'),kind:'board',bg:'grid',z:1,page:0,last:Date.now()};try{await put('files',f)}catch(e){}openRec(f)};
$('#bset').onclick=()=>{const b=modal(`<b>الإعدادات</b><input id="sn" value="${esc(prof.name)}" placeholder="الاسم"><input id="sf" value="${esc(prof.field||'')}" placeholder="التخصص"><div class="row" style="margin:0"><label class="btn g" style="flex:1;text-align:center">تغيير الصورة<input id="sp" type="file" accept="image/*" hidden></label></div><select id="st"><option value="auto">المظهر: تلقائي</option><option value="light">فاتح</option><option value="dark">داكن</option></select><div class="sw" id="ssw"></div><label class="tg"><input type="checkbox" id="sa"> رفض لمس اليد أثناء الكتابة</label><label class="tg"><input type="checkbox" id="sb"> الرسم بالإصبع (بدون قلم)</label><label class="tg"><input type="checkbox" id="szn"> منطقة اليد الخافتة</label><label class="tg">سرعة التمرير التلقائي <input type="range" id="sspd" min="60" max="1200" step="20"></label><label class="btn g"><span>تغيير خلفية البرنامج</span><input id="sbi" class="fi" type="file" accept="image/*"></label><button class="btn g" id="sbr">الخلفية الافتراضية</button><label class="tg">تعتيم الخلفية <input type="range" id="sbo" min="0" max="90" step="5"></label><button class="btn g" id="sbk">تصدير نسخة احتياطية</button><label class="btn g">استعادة نسخة<input id="sri" class="fi" type="file" accept=".json,application/json"></label><small class="mu">اختصارات: Ctrl+Z تراجع، Ctrl+Y إعادة، P قلم، H تظليل، E ممحاة، + و − للتكبير.</small><button class="btn g" id="sx">مسح كل البيانات</button><div class="r"><button class="btn" id="sok">حفظ</button></div>`);
$('#st').value=cfg.theme;$('#sa').checked=cfg.palm;$('#sb').checked=cfg.touch;$('#szn').checked=cfg.zone!==false;$('#sspd').value=cfg.spd||240;swatches($('#ssw'),cfg.accent,c=>{cfg.accent=c;applyCfg()});let ph=prof.photo;$('#sp').onchange=e=>e.target.files[0]&&readPhoto(e.target.files[0],u=>{ph=u;toast('تم اختيار الصورة')});
$('#sbo').value=Math.round((cfg.bgo??.8)*100);$('#sbo').oninput=e=>{cfg.bgo=e.target.value/100;saveCfg();applyBg()};$('#sbr').onclick=()=>{cfg.bgi='';saveCfg();applyBg();toast('تمت استعادة الخلفية الافتراضية')};$('#sbi').onchange=e=>{const f=e.target.files[0];if(f)setBg(f)};$('#sbk').onclick=()=>backup().catch(()=>toast('تعذر إنشاء النسخة'));$('#sri').onchange=e=>e.target.files[0]&&restore(e.target.files[0]).catch(()=>toast('ملف النسخة غير صالح'));$('#sx').onclick=async()=>{if(await ask('سيتم حذف الملفات والتعليقات والحساب نهائيًا. متابعة؟')){indexedDB.deleteDatabase('hima');localStorage.clear();location.reload()}};
